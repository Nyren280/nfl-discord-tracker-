name: NFL Scoreboard Bot

on:
  schedule:
    # Runs every 15 minutes from 16:00 UTC to 05:00 UTC on Thu, Sat, Sun, Mon
    - cron: '*/15 16-23,0-5 * * 0,1,4,6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tracker
        env:
          DISCORD_WEBHOOK_SAINTS: ${{ secrets.DISCORD_WEBHOOK_SAINTS }}
          DISCORD_WEBHOOK_PANTHERS: ${{ secrets.DISCORD_WEBHOOK_PANTHERS }}
          DISCORD_ROLE_SAINTS: ${{ secrets.DISCORD_ROLE_SAINTS }}
          DISCORD_ROLE_PANTHERS: ${{ secrets.DISCORD_ROLE_PANTHERS }}
        run: python nfl_tracker.py
