name: NFL Live Score Tracker

on:
  schedule:
    # Runs every 15 minutes during game days
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger testing from GitHub UI

# Explicit write permissions to commit sent_scores.json back to your repo
permissions:
  contents: write

jobs:
  track-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Live Score Tracker
        env:
          DISCORD_WEBHOOK_NO: ${{ secrets.DISCORD_WEBHOOK_NO }}
          DISCORD_ROLE_NO: ${{ secrets.DISCORD_ROLE_NO }}
          DISCORD_WEBHOOK_CAR: ${{ secrets.DISCORD_WEBHOOK_CAR }}
          DISCORD_ROLE_CAR: ${{ secrets.DISCORD_ROLE_CAR }}
        run: python nfl_tracker.py

      - name: Commit & Push Sent Scores Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_scores.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sent scores cache [skip ci]" && git push)
